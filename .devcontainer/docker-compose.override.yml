# Auto-generated by `closs init` — do not edit by hand.
# To regenerate: re-run `closs init` (picks up changes to ~/.config/claudosseum/config).

name: ${COMPOSE_PROJECT_NAME:-claude-code}

# ── Per-workspace isolation ───────────────────────────────────────────────────
# Container name and claude-config volume are prefixed with the workspace folder
# name and scoped to slug 8585c3d3 (a hash of the workspace path) so two
# workspaces on the same machine never share ~/.claude credentials or state.
services:
  claude:
    image: paparazzi-dev_closs
    build:
      context: .
      dockerfile: Dockerfile.local
    platform: linux/amd64
    container_name: paparazzi-dev_closs-8585c3d3
    cap_add:
      - NET_ADMIN   # required for iptables
      - NET_RAW     # required for iptables/ipset
    volumes:
      - paparazzi-dev_claude-config-8585c3d3:/home/vscode/.claude
      - /Users/devinbellll/.gitconfig:/home/vscode/.gitconfig:ro
      - /Users/devinbellll/.zshrc:/home/vscode/.zshrc:ro
      - /Users/devinbellll/.oh-my-zsh/themes/half-life-rose-pine.zsh-theme:/home/vscode/.oh-my-zsh/custom/themes/half-life-rose-pine.zsh-theme:ro

volumes:
  paparazzi-dev_claude-config-8585c3d3:
    name: paparazzi-dev_claude-config-8585c3d3   # explicit name prevents Compose prepending the project prefix

# ── Project image extension ───────────────────────────────────────────────────
# Swap in a local Dockerfile that layers your tools on top of claude-code-base.
# The base image must be built before this layer can reference it.
#
# Workflow:
#   1. Build the base once:
#        docker build -f .devcontainer/Dockerfile -t claude-code-base .devcontainer/
#   2. Copy the template and add your tools:
#        cp .devcontainer/Dockerfile.local.example .devcontainer/Dockerfile.local
#   3. Edit Dockerfile.local — uncomment and adjust the toolchain block
#   4. Uncomment the services block below
#   5. Reopen in Container — VS Code picks up both compose files automatically
#
# services:
#   claude:
#     image: claude-code-local              # name for the extended image
#     build:
#       context: .                          # relative to this compose file (.devcontainer/)
#       dockerfile: Dockerfile.local        # gitignored per-project layer
#     platform: linux/amd64                 # pin for cross-platform builds (e.g. Apple Silicon)
